<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
    <title>Winking Emoji Favicon</title>
    <defs>
        <radialGradient id="grad" cx="50%" cy="40%" r="60%" fx="50%" fy="40%">
            <stop offset="0%" style="stop-color:rgb(255,255,150);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgb(255,220,0);stop-opacity:1" />
        </radialGradient>
    </defs>
    <circle cx="128" cy="128" r="120" fill="url(#grad)" stroke="rgba(0,0,0,0.1)" stroke-width="4"/>
    
    <!-- Left eye (wink) -->
    <path d="M 80 115 C 90 105, 110 105, 120 115" stroke="#333" stroke-width="10" fill="none" stroke-linecap="round"/>
    
    <!-- Right eye -->
    <circle cx="170" cy="110" r="12" fill="#333"/>
    
    <!-- Smile -->
    <path d="M 90 160 Q 128 190, 166 160" stroke="#333" stroke-width="10" fill="none" stroke-linecap="round"/>
</svg>
