<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
    @keyframes beam-animation {
        0% { opacity: 0.5; }
        50% { opacity: 0.8; }
        100% { opacity: 0.5; }
    }
    @keyframes robot-float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
    }
    .beam {
        animation: beam-animation 3s infinite;
    }
    .robot {
        animation: robot-float 2s infinite ease-in-out;
    }
</style>
<g>
    <!-- UFO Main Body -->
    <path d="M 30,130 C 30,100 70,80 128,80 C 186,80 226,100 226,130 L 30,130 Z" fill="#C0C0C0"/>
    <path d="M 38,130 C 38,110 75,95 128,95 C 181,95 218,110 218,130 L 38,130 Z" fill="#D3D3D3"/>
    
    <!-- UFO Dome -->
    <path d="M 90,80 A 38,38 0 0,1 166,80 Z" fill="#7AF0F5" opacity="0.8"/>
    <!-- Alien -->
    <path d="M 120,78 A 12,12 0 1,1 136,78 A 12,12 0 0,1 120,78 Z" fill="#3D7E81"/>
    <path d="M 128,60 L 122,80 L 134,80 Z" fill="#3D7E81" />

    <!-- UFO Lights -->
    <circle cx="60" cy="130" r="8" fill="#AFFFFF"/>
    <circle cx="95" cy="138" r="8" fill="#AFFFFF"/>
    <circle cx="128" cy="140" r="8" fill="#AFFFFF"/>
    <circle cx="161" cy="138" r="8" fill="#AFFFFF"/>
    <circle cx="196" cy="130" r="8" fill="#AFFFFF"/>
    
    <!-- Tractor Beam -->
    <path class="beam" d="M 90,145 L 70,230 L 186,230 L 166,145 Z" fill="#7AF0F5"/>
    
    <!-- Robot -->
    <g class="robot" transform="translate(0, -5)">
        <rect x="104" y="170" width="48" height="40" fill="#B22222" rx="4"/>
        <rect x="100" y="166" width="56" height="44" fill="#C0C0C0" rx="6"/>
        <!-- Eyes -->
        <circle cx="118" cy="184" r="6" fill="#AFFFFF"/>
        <circle cx="138" cy="184" r="6" fill="#AFFFFF"/>
        <!-- Mouth -->
        <rect x="114" y="196" width="28" height="4" fill="#696969"/>
        <path d="M115 197 h2 v2 h-2z m4 0 h2 v2 h-2z m4 0 h2 v2 h-2z m4 0 h2 v2 h-2z m4 0 h2 v2 h-2z m4 0 h2 v2 h-2z" fill="white"/>
        <!-- Antenna -->
        <line x1="128" y1="166" x2="128" y2="156" stroke="#696969" stroke-width="2"/>
        <circle cx="128" cy="154" r="3" fill="#696969"/>
    </g>
</g>
</svg>
